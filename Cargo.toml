[package]
name = "snipwave"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
resolver = "3"
description = "System audio sampler: catch the last seconds, trim, export WAV"

[dependencies]
audioadapter-buffers = "5.2.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
env_logger = "0.11.12"
global-hotkey = "0.10.0"
hound = "3.5.1"
log = "0.4.35"
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
rtrb = "0.4.1"
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "warn"
let_underscore_must_use = "warn"

[package.metadata.bundle]
name = "SnipWave"
identifier = "com.snipwave.SnipWave"
icon = ["assets/icons/macos/icon.icns"]
category = "public.app-category.music"
short_description = "System audio sampler"

[package.metadata.bundle.osx]
minimum_system_version = "14.6"
info_plist_exts = ["packaging/macos/Info.ext.plist"]
